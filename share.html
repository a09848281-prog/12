<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>位置情報の共有</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div><div class="eyebrow">CONSENT-BASED SHARING</div><h1>📍 位置情報の共有</h1></div><span class="pill">同意確認</span></header><main><section class="card"><h2 id="title">共有情報を確認しています…</h2><p id="purpose" class="muted">共有URLを確認しています。</p><div id="status" class="notice">位置情報は、説明を確認して「同意して開始」を押すまで取得されません。</div><label class="consent"><input id="agree" type="checkbox"> 上記の目的を理解し、このブラウザから位置情報を取得して送信することに同意します。</label><div class="row"><button id="start" disabled>同意して位置情報の共有を開始</button><button id="stop" class="secondary" disabled>停止して同意を取り消す</button></div><p class="muted small">位置情報の取得にはブラウザの許可も必要です。停止後は新しい取得・送信を行いません。ページを閉じても保存済みの記録は消えません。</p></section></main><footer>共有を開始するかどうかは本人が選べます。</footer><script src="share.js"></script></body></html>
